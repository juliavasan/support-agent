[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.0.1"
description = "AI agent that works a ServiceNow incident queue end to end, with KB search, CDP bug reproduction, Jira escalation, and human approval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julia Vasan" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "langgraph>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.29",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and obviously fake credentials.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["support_agent", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_agent = ["prompts/*.md", "analysis/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits the real ServiceNow instance or a running langgraph dev server (opt-in)",
    "postgres: needs the local pgvector database from docker-compose.yml (opt-in)",
]
addopts = "-m 'not live and not postgres'"
